---
- name: Provision Raspberry Pi for solar monitoring
  hosts: solar_pi
  become: true

  tasks:
    - name: Update APT cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes

    - name: Install required packages
      apt:
        name:
          - podman
          - podman-compose
          - uidmap
          - slirp4netns
          - fuse-overlayfs
          - curl
          - git
        state: present

    - name: Enable lingering for deployment user
      command: loginctl enable-linger {{ ansible_user }}

    - name: Create user-level container storage config
      copy:
        content: |
          [storage]
          driver = "overlay"
          runroot = "/run/user/1000"
          graphroot = "/home/{{ ansible_user }}/.local/share/containers/storage"
          [storage.options]
          size = ""
          remap-uids = ""
          remap-gids = ""
          ignore_chown_errors = ""
          mount_program = "/usr/bin/fuse-overlayfs"
          mountopt = "nodev"
        dest: /home/{{ ansible_user }}/.config/containers/storage.conf
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Create target directory
      file:
        path: /opt/solar-monitoring
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
