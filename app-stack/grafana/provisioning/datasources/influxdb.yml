apiVersion: 1

datasources:
  - name: InfluxDB
    uid: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $GF_INFLUX_ORG
      defaultBucket: $GF_INFLUX_BUCKET
      tlsSkipVerify: true
    secureJsonData:
      token: $GF_INFLUX_TOKEN
    isDefault: true
    editable: false
