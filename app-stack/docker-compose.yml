version: '3.8'

# This block enables complete Docker network compatibility mode 
# inside Podman, bypassing all manual network file creation.
x-podman:
  default_net_behavior_compat: true

services:
  collector:
    build:
      context: ./collector
      dockerfile: Containerfile
    environment:
      INVERTER_IP: ${INVERTER_IP}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    depends_on:
      - influxdb

  influxdb:
    image: docker.io/library/influxdb:2.7
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    ports:
      - "8086:8086"

  grafana:
    image: docker.io/grafana/grafana-oss:latest
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INFLUX_TOKEN: ${INFLUX_TOKEN}
      GF_INFLUX_ORG: ${INFLUX_ORG}
      GF_INFLUX_BUCKET: ${INFLUX_BUCKET}
    ports:
      - "3000:3000"
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  grafana-data:
